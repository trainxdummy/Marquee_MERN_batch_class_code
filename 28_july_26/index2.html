<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-direction: column;
        }
        button{
            background-color: blue;
            color : white;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            border: none;
            padding: 4px 8px;
        }
        .quote_container{
            background-color: rgb(208, 208, 246);
            padding: 10px;
            border-radius: 10px;
            min-height: 100px;
            min-width: 500px;

        }

        .quote_author{
            font-weight: bold;
        }


    </style>
</head>
<body>
        <h1>Quote Generator</h1>

        <div class="quote_container">
            <p class="quote_text">Click the button to generate new quote</p>
            <p class="quote_author"></p>
        </div>

        <button>New Quote</button>

        <script>

            const quotes = [
                {text:"A rose by any other name would smell as sweet",author:"William Shakespere"},
                {text:"I have always depended on the kindness of strangers.",author:"Blanche Dubois"},
                {text:"A rose by any other name would smell as sweet",author:" Shakespere"},
                {text:"I have always depended on the kindness of strangers.",author:" Dubois"},
            ]

            let quote_text = document.querySelector(".quote_text")
            let quote_author = document.querySelector(".quote_author")

            function generateNewQuote(){
               let randomIdx =  Math.floor(Math.random() * quotes.length)
                quote_text.innerHTML =  quotes[randomIdx].text
                quote_author.innerHTML =  `- ${quotes[randomIdx].author}`
            }

            let btn = document.querySelector("button")
            btn.addEventListener("click",generateNewQuote )
        </script>
</body>
</html>
