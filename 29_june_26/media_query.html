<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query basic example</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background-color: beige;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card{
            background-color: rgb(58, 58, 244);
            height: 100px;
            width: 300px;

            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

     
         @media (orientation: portrait) {
            body{
                flex-direction: column;
            }

            .card{
                background-color: orangered;
                border-radius: 10px;
                height: 80px;
                width: 250px;
            }

        } 

        /* mobile screen */
        /* @media (max-width:375px) {
            .card{
                background-color: green;
                border-radius: 20px;
                height: 60px;
                width: 220px;
            }
        } */
    </style>
</head>
<body>
        <div class="card"> Resize your browser </div>
        <div class="card"> Resize your browser </div>
        <div class="card"> Resize your browser </div>
        <div class="card"> Resize your browser </div>
</body>
</html>
