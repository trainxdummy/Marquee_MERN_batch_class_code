<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card</title>

  <style>
    body{
      background-color: rgb(172, 175, 177);
    }
    .card{
      background-color: white;
      padding: 10px;
      width: 200px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
      
    }

    h1{
      text-align: center;
    }

    .card img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;

    }

    .container{
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>Our Products</h1>

  <div class="container">
    <!-- cards here -->
  </div>
    
  <script>
     const products = [

            {
                name: "Laptop",
                brand: "Dell",
                price: "₹65,000",
                category: "Electronics",
                image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            },

            {
                name: "iPhone",
                brand: "Apple",
                price: "₹80,000",
                category: "Mobile",
                image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            },

            {
                name: "Shoes",
                brand: "Nike",
                price: "₹4,000",
                category: "Fashion",
                image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            },

            {
                name: "Headphones",
                brand: "Sony",
                price: "₹5,500",
                category: "Electronics",
                image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            },

            {
                name: "Watch",
                brand: "Titan",
                price: "₹3,500",
                category: "Accessories",
                image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            },
            {
                name: "Watch",
                brand: "Titan",
                price: "₹3,500",
                category: "Accessories",
                image : "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            }

        ];

    let container = document.querySelector(".container")

    
    products.map((product) => {
     let card =  document.createElement("div")
     card.className = "card"
    
     card.innerHTML = ` 
        <img src=${product.image}  >
        name : ${product.name} </br>
        brand : ${product.brand} </br>
        category : ${product.category} </br>
        price : ${product.price}
    `

    container.append(card);
   })


  </script>
</body>
</html>
