<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanning in CSS Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: beige;
            padding: 20px;
        }

        .grid-container{
            /* background-color: red; */
            border-radius: 10px;
            border: 2px solid red;
            padding: 10px;

            display: grid;
            grid-template-columns: 200px 200px 200px 200px;
            gap: 10px;

            grid-auto-rows: 100px;

        }

        .box{
            background-color: rgb(43, 247, 43);
            border: 4px solid green;

            /* height: 50px;
            width: 50px; */
            border-radius: 10px;
            color: white;
            font-size: 30px;
            text-align: center;
        }

        .box-2{
            background-color: rgb(237, 237, 72);
            border: 4px solid rgb(170, 170, 3);
            grid-column: 2/4;
        }

        .box-1{
            background-color: rgb(250, 79, 79);
            border: 4px solid rgb(255, 0, 0);
            
            grid-row-start: 1;
            grid-row-end: 3;
        }

    </style>
</head>
<body>
    <div class="grid-container">
        <div class="box box-1">1</div>
        <div class="box box-2">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
