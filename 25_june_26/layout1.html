<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout in CSS Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: beige;
            padding: 20px;
        }

        .grid-container{
            width: 1000px;
            border-radius: 10px;
            border: 2px solid red;
            padding: 10px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;

            grid-auto-rows: 100px;

        }

        .box{
            background-color: rgb(43, 247, 43);
            border: 4px solid green;

            border-radius: 10px;
            color: white;
            font-size: 30px;
            text-align: center;
        }

       .header{
        background-color: rgb(245, 79, 79);
        border: 4px solid red;
        grid-column: 1/4;
       }

       .main{
        background-color: rgb(97, 97, 246);
        border: 4px solid blue;
       }

       .footer{
        background-color: rgb(240, 240, 84);
        border: 4px solid rgb(220, 209, 3);
        grid-column: 1/4;
       }

       .aside{
        grid-column: 2/4;
       }

    </style>
</head>
<body>
    <div class="grid-container">
        <div class="box header">Header</div>
        <div class="box main">main</div>
        <div class="box aside">aside</div>
        <div class="box footer">footer</div>
    </div>
</body>
</html>
